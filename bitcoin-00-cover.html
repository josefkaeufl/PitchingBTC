<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Pitch · Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     BITCOIN PITCH — SHARED DESIGN SYSTEM
     Dieselbe :root + .slide-Basis in jeder Folie verwenden,
     damit alle Module zusammenpassen. Nur der Inhalt im
     .slide-body ändert sich pro Folie.
     ============================================================ */
  :root{
    --paper:#F2F1EC;
    --card:#FBFAF6;
    --ink:#1A1813;
    --ink-soft:#6E685D;
    --btc:#F7931A;       /* Bitcoin-Orange */
    --btc-deep:#C56F08;  /* lesbares Orange auf hellem Grund */
    --line:rgba(26,24,19,.14);
    --font-display:"Space Grotesk",system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,monospace;
    --font-body:"Inter",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#2a2722;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
    font-family:var(--font-body);
  }

  .slide{
    position:relative;
    width:min(1120px,100%);
    aspect-ratio:16/9;
    background:var(--paper);
    color:var(--ink);
    border-radius:5px;
    overflow:hidden;
    box-shadow:0 40px 90px -34px rgba(0,0,0,.72);
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:clamp(30px,4.3vw,58px);
  }
  /* faint ledger hairlines — Signatur-Textur, sehr dezent */
  .slide::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(
      to bottom, transparent 0 38px, rgba(26,24,19,.025) 38px 39px);
    mix-blend-mode:multiply;
  }

  /* ---- header (mono, ledger-artig) ---- */
  .head{
    position:relative;z-index:2;
    display:flex;justify-content:flex-end;align-items:baseline;
    font-family:var(--font-mono);
    font-size:clamp(10px,1vw,12.5px);
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .head .tag{color:var(--btc-deep);font-weight:500;}

  /* ---- body ---- */
  .slide-body{position:relative;z-index:2;align-self:center;}

  .kicker{
    font-family:var(--font-mono);
    font-size:clamp(11px,1.1vw,13px);
    letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:18px;
  }
  .title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(58px,12vw,150px);
    line-height:.9;letter-spacing:-.03em;
  }
  .subtitle{
    font-family:var(--font-display);
    font-weight:500;
    font-size:clamp(20px,3.1vw,38px);
    line-height:1.1;letter-spacing:-.01em;
    margin-top:14px;
  }
  .subtitle .accent{color:var(--btc-deep);}
  .lede{
    font-size:clamp(13.5px,1.55vw,18px);
    line-height:1.6;color:var(--ink-soft);
    max-width:50ch;margin-top:22px;
  }

  /* ---- signature: großes ₿-Glyph rechts ---- */
  .glyph{
    position:absolute;z-index:1;
    right:clamp(-10px,1vw,40px);
    top:50%;transform:translateY(-50%);
    font-family:var(--font-display);font-weight:700;
    font-size:clamp(240px,42vw,560px);
    line-height:1;
    color:var(--btc);
    opacity:.13;
    user-select:none;
  }

  /* ---- footer ---- */
  .foot{
    position:relative;z-index:2;
    display:flex;justify-content:space-between;align-items:center;
    padding-top:16px;border-top:1px solid var(--line);
    font-family:var(--font-mono);
    font-size:clamp(10px,1vw,12.5px);
    letter-spacing:.1em;color:var(--ink-soft);
  }
  .brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:500;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--btc);}
  a.brand{text-decoration:none;transition:color .15s ease;}
  a.brand:hover{color:var(--btc-deep);}

  @media (max-width:560px){
    .lede{max-width:none;}
    .glyph{opacity:.08;}
  }
</style>
</head>
<body>
  <section class="slide" role="img" aria-label="Bitcoin Pitch – cover slide">
    <div class="glyph" aria-hidden="true">₿</div>

    <header class="head">
      <span class="tag">Module · Cover</span>
    </header>

    <div class="slide-body">
      <p class="kicker">An open money network · 2026</p>
      <h1 class="title">Bitcoin</h1>
      <p class="subtitle">Money without a <span class="accent">middleman.</span></p>
      <p class="lede">A global payment network anyone can use — no bank, no permission,
        no central control. These slides explain, step by step, how it works and
        why it wins people over.</p>
    </div>

    <footer class="foot">
      <a class="brand" href="https://x.com/PitchingBTC" target="_blank" rel="noopener"><span class="dot"></span>@PitchingBTC</a>
      <span>Mix &amp; match modules</span>
    </footer>
  </section>
</body>
</html>
